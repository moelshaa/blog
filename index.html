<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grflow's blog</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
         background: linear-gradient(145deg, rgb(255, 240, 206) 0%, rgb(255, 244, 221) 100%);
      }

      body {
        min-height: 100vh;
        background: linear-gradient(145deg, rgb(255, 240, 206) 0%, rgb(255, 244, 221) 100%);
        font-family: sans-serif;
        font-optical-sizing: auto;
        font-size: medium;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        color: #2e2a24;
        line-height: 1.2;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .landing {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: gentleAppear 1.2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        width: 100%;
        max-width: 520px;
        gap: 2.4rem;
      }

      h1 {
        font-size: clamp(2.4rem, 9vw, 4.2rem);
        font-weight: 350;
        letter-spacing: -0.02em;
        word-spacing: 0.05em;
        color: #1f1c18;
        line-height: 1.1;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.02);
        padding-left: 0.05em;
      }

      /* plain, minimal list of posts */
      .posts {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        font-size: 1.15rem;
        font-weight: 350;
        letter-spacing: -0.01em;
        color: #2e2a24;
      }

      .posts li {
        transition: color 0.2s ease;
      }

      .posts li:hover {
        color: #1f1c18;
      }

      /* footer */
      footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.4rem 1.4rem;
        font-size: 0.85rem;
        font-weight: 350;
        letter-spacing: 0.02em;
        color: #7a736a;
        margin-top: 1rem;
      }

      a {
        color: #2e2a24;
        text-decoration: none;
        transition: color 0.2s ease;
        border-bottom: 1px solid transparent;
      }

      footer a {
        color: #7a736a;
        text-decoration: none;
        transition: color 0.2s ease;
        border-bottom: 1px solid transparent;
      }

      a:hover {
        color: #1f1c18;
        border-bottom-color: #c9c1b6;
      }

      @keyframes gentleAppear {
        0% {
          opacity: 0;
          transform: translateY(12px);
          filter: blur(1px);
        }

        100% {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      ::selection {
        background: #d9d2c5;
        color: #1f1c18;
      }

      @media (max-width: 400px) {
        h2 {
          font-size: 1.3rem;
          margin-top: 5px;
        }

        .landing {
          gap: 1.8rem;
        }

        .posts {
          font-size: 1rem;
          gap: 0.7rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="landing">
      <h2>𓆝 𓆟 𓆞 𓆝 𓆟</h2>
      <ul class="posts">
        <li><a href="posts/realizations.html">some realizations</a></li>
        <!-- <li>the quiet art of noticing</li>
        <li>building honest objects</li>-->
      </ul>

        <a href="about.html">ⓘ about</a>
        <br>
        <p>© 2026 grflows' blog. All Rights Reserved.</p>
      </footer>
    </div>
  </body>
</html>
